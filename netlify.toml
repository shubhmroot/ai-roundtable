[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

# Redirect API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Fallback for single page app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
